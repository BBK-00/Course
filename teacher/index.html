<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Оқытушы панелі</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="panel-base.css">
<link rel="stylesheet" href="dashboard.css?v=20261106-analytics">
</head>
<body class="teacher-dashboard">
<main id="login" class="login">
  <a class="login-brand" href="../"><span class="logo-mark">ББ</span> Интерактивті сабақтар</a>
  <h1>Қош келдіңіз!</h1><p>Сабақтарыңыз бен студенттеріңіздің нәтижелері бір жерде.</p>
  <form id="fLogin"><label for="pw">Құпиясөз</label><input class="field" id="pw" type="password" autocomplete="current-password" required>
    <div class="err" id="eLogin" role="alert"></div><button class="btn primary login-submit" id="bLogin" type="submit">Кіру</button>
  </form>
</main>
<div id="app" hidden>
  <aside class="dash-sidebar" id="sidebar" aria-label="Негізгі мәзір">
    <a href="../" class="dash-brand"><span class="logo-mark">ББ</span><span class="nav-label">Оқытушы панелі</span></a>
    <button class="sidebar-collapse icon-btn" id="collapseSidebar" type="button" aria-label="Мәзірді жинау" aria-expanded="true">«</button>
    <nav id="mainNav">
      <button class="dash-nav on" type="button" data-route="live"><span data-icon="monitor"></span><span class="nav-label">Сабақ</span></button>
      <button class="dash-nav" type="button" data-route="homework"><span data-icon="file"></span><span class="nav-label">Үй жұмысы</span><span id="hwBadge" class="nav-count" hidden></span></button>
      <button class="dash-nav" type="button" data-route="journal"><span data-icon="book"></span><span class="nav-label">Журнал</span></button>
      <button class="dash-nav" type="button" data-route="roster"><span data-icon="users"></span><span class="nav-label">Топтар</span></button>
      <button class="dash-nav" type="button" data-route="archive"><span data-icon="archive"></span><span class="nav-label">Архив</span></button>
    </nav>
    <div class="sidebar-bottom"><span class="teacher-avatar">БҚ</span><span class="nav-label"><b>Оқытушы</b><small>Сабақтарды басқару</small></span><button id="bOut" class="icon-btn" type="button" title="Шығу" aria-label="Шығу"><span data-icon="logout"></span></button></div>
  </aside>
  <button class="sidebar-shade" id="sidebarShade" aria-label="Мәзірді жабу" hidden></button>
  <div class="dash-workspace">
    <header class="dash-topbar"><button id="mobileMenu" class="icon-btn" type="button" aria-label="Мәзірді ашу" aria-expanded="false"><span data-icon="menu"></span></button><div id="contextBar" class="context-bar"></div>
      <nav id="topnav" class="top-actions" hidden><span id="lessonStatus" class="status-pill"></span><a href="#" id="bLesson" class="btn sm" title="Сабақ бетін ашу"><span data-icon="external"></span><span class="action-label">Сабақ беті</span></a><button id="projectorButton" type="button" class="btn sm"><span data-icon="monitor"></span><span class="action-label">Проектор</span></button></nav>
    </header>
    <main class="dash-main" id="mainContent"><div id="pageHeading" class="page-heading"></div>
      <div class="tabs lesson-tabs" id="tabs" role="tablist" aria-label="Сабақ бөлімдері"><button class="tab on" type="button" role="tab" data-t="live">Барысы</button><button class="tab" type="button" role="tab" data-t="analysis">Талдау</button><button class="tab" type="button" role="tab" data-t="wrap">Бекіту</button><button class="tab" type="button" role="tab" data-t="plan">Жоспар</button></div>
      <section class="sec on" id="s-live" aria-label="Сабақ барысы"></section><section class="sec" id="s-analysis" aria-label="Талдау"></section><section class="sec" id="s-wrap" aria-label="Бекіту"></section><section class="sec" id="s-plan" aria-label="Сабақ жоспары"></section><section class="sec" id="s-roster" aria-label="Топтар"></section><section class="sec" id="s-journal" aria-label="Журнал"></section><section class="sec" id="s-archive" aria-label="Архив"></section><section class="sec" id="s-homework" aria-label="Үй жұмысы"></section>
    </main>
    <footer class="dash-sync" id="syncStatus" role="status"><i></i><span>Деректерді жүктеу…</span></footer>
  </div>
</div>
<div class="overlay pj" id="pj" hidden role="dialog" aria-modal="true" aria-label="Проектор"><div class="pjbox"><button class="btn x" id="pjX" type="button">Жабу</button><p>Сабаққа кіру</p><p id="pjUrl"></p><div class="pcode" id="pjCode"></div><p id="pjTtl"></p></div></div>
<div class="overlay" id="ov" hidden role="dialog" aria-modal="true" aria-label="Студенттің жұмысы"><div class="panel" id="panel" tabindex="-1"></div></div>
<div class="overlay" id="newLessonDialog" hidden role="dialog" aria-modal="true" aria-labelledby="newLessonTitle"><div class="new-lesson-dialog"><div class="row"><h2 id="newLessonTitle">Жаңа сабақ</h2><span class="sp"></span><button type="button" class="icon-btn" id="closeNewLesson" aria-label="Жабу">✕</button></div><div id="newLessonBody"></div></div></div>
<div id="toast" class="dash-toast" role="status" hidden></div>
<script src="lesson-catalog.js"></script>
<script src="archive.js?v=20261106"></script>
<script src="analysis.js?v=20261106"></script>
<script src="panel.js?v=20261106-total100"></script>
</body>
</html>
