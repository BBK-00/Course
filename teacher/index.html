<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Оқытушы панелі</title>
<link rel="stylesheet" href="../assets/site.css">
<style>
.t-main{padding:24px 0 60px}
.login{max-width:460px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:var(--shadow)}
.login h1{font-size:1.9rem;margin:0 0 6px}.login p{color:var(--muted);margin:0 0 20px}
.field{width:100%;min-height:46px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);font:inherit;background:var(--surface);color:var(--text)}
.field:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.btn{font:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--primary)}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.9rem}.btn.danger{color:#b91c1c}.btn:disabled{opacity:.5;cursor:wait}
.err{color:#b91c1c;min-height:1.4em;margin:10px 0 0}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;min-height:44px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted)}
.tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:1.25rem}
.code{font-size:4.2rem;font-weight:800;letter-spacing:.12em;color:var(--primary-2);line-height:1.1;font-family:ui-monospace,Consolas,monospace}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.stats4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat4{background:var(--surface-2);border-radius:14px;padding:12px 16px}.stat4 b{display:block;font-size:1.8rem;line-height:1.1;color:var(--primary-2)}.stat4 span{color:var(--muted);font-size:.9rem}
.timer{font-size:2rem;font-weight:800;font-family:ui-monospace,Consolas,monospace}.timer.late{color:#b91c1c}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:.95rem}
.t th{background:#0f3a73;color:#fff;font-weight:600;padding:10px;text-align:center;white-space:nowrap}
.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.t td.l,.t th.l{text-align:left}
.t tr.absent td{background:#f3f4f6;color:var(--muted)}.t tr.red td{background:#fde2e2}.t tr.org td{background:#ffe8cc}
.pill{display:inline-block;min-width:3em;padding:2px 10px;border-radius:999px;font-weight:700}
.sub{display:block;color:var(--muted);font-size:.82rem}.mark{color:#15803d;font-weight:700}
.gh{display:flex;gap:10px;align-items:center;margin:18px 0 8px}.gh h3{margin:0;font-size:1.1rem}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.45);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:20px 12px}
.overlay[hidden]{display:none}
.panel{background:var(--bg);border-radius:22px;width:min(1280px,100%);box-shadow:0 20px 60px rgba(15,23,42,.35)}
.p-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 22px;background:var(--surface);border-radius:22px 22px 0 0;border-bottom:1px solid var(--line)}
.p-head h2{margin:0;font-size:1.35rem}.sp{flex:1}
.p-body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;padding:18px 22px 24px}
@media (max-width:900px){.p-body{grid-template-columns:1fr;padding:12px}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.box h3{margin:0 0 8px;font-size:1rem;color:var(--primary-2)}
.box pre{margin:0 0 8px;white-space:pre-wrap;word-break:break-word;font:.9rem/1.5 ui-monospace,Consolas,monospace;max-height:300px;overflow:auto;background:#F1F5F9;border-radius:10px;padding:8px 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.93rem}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.aibox{border-left:4px solid var(--primary);background:var(--primary-soft);border-radius:10px;padding:8px 12px;margin:8px 0}
.edit{border:2px solid var(--primary);background:#F8FBFF}
.edit label{display:block;font-weight:600;margin:8px 0 4px;font-size:.92rem}
.msg{min-height:1.4em;margin-top:8px;font-weight:600}.ok{color:#15803d}.bad{color:#b91c1c}
.big{font-size:1.5rem;font-weight:800;text-align:center;max-width:7em}
textarea.field{min-height:6em}
.qs{margin:6px 0 10px;padding-left:1.3em;font-size:1.15rem}.qs li{margin:6px 0}.qs li.cur{font-weight:700;color:var(--primary-2)}
.wheel-wrap{position:relative;width:min(380px,100%);margin:6px auto}
.wheel-wrap canvas{width:100%;height:auto;display:block;border-radius:50%;box-shadow:0 8px 28px rgba(15,23,42,.18)}
.pointer{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid #dc2626;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));z-index:2}
.winner{background:var(--primary-soft);border:2px solid var(--primary);border-radius:16px;padding:16px 18px;margin-top:14px}
.winner h3{margin:0 0 4px;font-size:1.4rem}.winner .q{font-size:1.2rem;font-weight:700;margin:8px 0}
.bar5{display:grid;grid-template-columns:70px 1fr 36px;gap:8px;align-items:center;margin:6px 0}
.bar5 .b{height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}.bar5 .b i{display:block;height:100%;background:var(--primary)}
.cmt{border-top:1px solid var(--line);padding:8px 0}
.qr{margin-top:10px}.qr summary{cursor:pointer;font-weight:600;color:var(--primary-2);min-height:40px;display:flex;align-items:center}.qr img{display:block;margin:8px auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.pj{background:#fff;align-items:center;z-index:80}
.pjbox{text-align:center;padding:16px;width:100%}
.pjbox img{width:min(52vh,86vw);height:auto;display:block;margin:0 auto;border:1px solid var(--line);border-radius:16px}
.pjbox .pcode{font-size:min(14vh,22vw);font-weight:800;letter-spacing:.14em;color:var(--primary-2);line-height:1.05;font-family:ui-monospace,Consolas,monospace;margin-top:10px}
.pjbox p{margin:6px 0;color:var(--muted);font-size:1.2rem}
.pjbox .x{position:absolute;right:16px;top:16px}
.plan-doc{line-height:1.6}.plan-doc h2{font-size:1.4rem;margin:1.2em 0 .4em}.plan-doc h3{font-size:1.15rem;margin:1em 0 .3em}
.plan-doc table{border-collapse:collapse;width:100%;margin:10px 0;font-size:.95rem;display:block;overflow-x:auto}
.plan-doc th,.plan-doc td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}.plan-doc th{background:var(--surface-2)}
.plan-doc ul,.plan-doc ol{padding-left:1.3em}
.sec{display:none}.sec.on{display:block}.tw+.card,.gh+.card{margin-top:16px}
.startgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:12px;align-items:end;margin:8px 0}@media (max-width:900px){.startgrid{grid-template-columns:1fr}}
.sf{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem;color:var(--muted)}.sf .field{color:var(--text);font-weight:500}
.btn.big{min-height:50px;font-size:1.05rem}
.sinfo{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:6px}.sc{background:var(--surface-2);border-radius:999px;padding:3px 12px;font-size:.88rem}
.gcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-top:10px}
.gcard{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface)}
.slist{max-height:380px;overflow:auto}.srow{border-top:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:0 0 10px;font-size:.88rem;color:var(--muted)}.lg{display:inline-flex;align-items:center;gap:6px}.lg i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);display:inline-block}
.jt{max-height:75vh}.jt thead th{position:sticky;top:0;z-index:2}.jt td:nth-child(2),.jt th:nth-child(2){position:sticky;left:0;background:var(--surface);z-index:1}.jt thead th:nth-child(2){background:#0f3a73;z-index:3}
.thsub{color:#cbd5e1!important;white-space:normal;max-width:12em;margin:0 auto}.jc{cursor:pointer}.jc:hover{outline:2px solid var(--primary);outline-offset:-2px}
.t tfoot td{background:var(--surface-2);font-weight:600;border-top:2px solid var(--line)}
</style>
</head>
<body>
<header class="site-head">
  <div class="wrap head-in"><span class="logo"><span class="logo-mark">ББ</span><span>Оқытушы панелі</span></span>
    <nav class="head-nav" id="topnav" hidden><a href="#" id="bLesson">📖 Сабақты ашу</a><a href="#" id="bOut">Шығу</a></nav></div>
</header>
<main class="wrap t-main">
  <section id="login" class="login">
    <h1>Оқытушы панелі</h1>
    <p>Құпиясөзді енгізіңіз.</p>
    <form id="fLogin"><input class="field" id="pw" type="password" placeholder="Құпиясөз" autocomplete="current-password" required>
      <div class="err" id="eLogin" role="alert"></div>
      <button class="btn primary" id="bLogin" type="submit" style="width:100%;margin-top:6px">Кіру</button></form>
  </section>
  <div id="app" hidden>
    <div class="tabs" id="tabs"><button class="tab on" data-t="live">📡 Сабақ</button><button class="tab" data-t="wrap">🎯 Бекіту</button><button class="tab" data-t="plan">📄 Сабақ жоспары</button><button class="tab" data-t="roster">👥 Топтар мен студенттер</button><button class="tab" data-t="journal">📒 Журнал</button></div>
    <section class="sec on" id="s-live"></section>
    <section class="sec" id="s-wrap"></section>
    <section class="sec" id="s-plan"></section>
    <section class="sec" id="s-roster"></section>
    <section class="sec" id="s-journal"></section>
  </div>
</main>
<div class="overlay pj" id="pj" hidden><div class="pjbox"><button class="btn x" id="pjX" type="button">✕ Жабу</button>
  <p style="font-size:1.5rem;color:var(--text);font-weight:700">Сабаққа кіру</p>
  <p id="pjUrl"></p><div class="pcode" id="pjCode"></div><p id="pjTtl"></p></div></div>
<div class="overlay" id="ov" hidden><div class="panel" id="panel"></div></div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const h = (tag, a, kids) => { const e = document.createElement(tag); for (const k in (a || {})) { if (k === 'text') e.textContent = a[k]; else if (k === 'class') e.className = a[k]; else if (k === 'on') { for (const ev in a[k]) e.addEventListener(ev, a[k][ev]); } else if (a[k] !== false && a[k] !== undefined) e.setAttribute(k, a[k]); } [].concat(kids === undefined ? [] : kids).forEach(c => { if (c !== null && c !== undefined && c !== false) e.append(c); }); return e; };
let QROPEN = false, TOK = '', LIVE = null, ROSTER = [], JOUR = null, TAB = 'live', DETAIL = null, busy = false, VIEW = 0, gFilter = '', jf = '', skew = 0, WMIN = 30, wDirty = false;
try { TOK = sessionStorage.getItem('ttok') || ''; } catch (e) {}
const band = v => v === '' || v === null || v === undefined ? '#e2e8f0' : v >= 90 ? '#b7e1c1' : v >= 75 ? '#dcefc8' : v >= 60 ? '#fff1b8' : '#ffd6cc';
const has = v => v !== '' && v !== null && v !== undefined;
const mmss = s => Math.floor(Math.max(0, s) / 60) + ':' + String(Math.max(0, s) % 60).padStart(2, '0');
const hhmm = t => { const d = new Date(t * 1000), p = n => String(n).padStart(2, '0'); return p(d.getHours()) + ':' + p(d.getMinutes()); };

async function api(path, body, method){
  try {
    const r = await fetch('/api/teacher/' + path, { method: method || (body ? 'POST' : 'GET'), headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOK }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json(); if (r.status === 401) { out(); return { ok: false, error: 'auth' }; } return j;
  } catch (e) { return { ok: false, error: 'network' }; }
}

/* ---------- Кіру ---------- */
async function login(pw){
  let j; try { j = await (await fetch('/api/teacher/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) })).json(); } catch (e) { j = { error: 'network' }; }
  if (!j.ok) { $('#eLogin').textContent = j.error === 'bad_password' ? 'Құпиясөз дұрыс емес.' : j.error === 'no_password' ? 'Құпиясөз бапталмаған: Cloudflare-де TEACHER_PASSWORD қосыңыз.' : j.error === 'wait' ? 'Қате көп болды. 10 минуттан кейін қайта көріңіз.' : 'Серверге қосыла алмады.'; return false; }
  TOK = j.token; try { sessionStorage.setItem('ttok', TOK); } catch (e) {} start(); return true;
}
function out(){ TOK = ''; try { sessionStorage.removeItem('ttok'); } catch (e) {} $('#app').hidden = true; $('#topnav').hidden = true; $('#login').hidden = false; $('#pw').value = ''; closeDetail(); }
$('#fLogin').addEventListener('submit', async e => { e.preventDefault(); $('#eLogin').textContent = ''; const b = $('#bLogin'); b.disabled = true; b.textContent = 'Тексеріп жатыр…'; await login($('#pw').value); b.disabled = false; b.textContent = 'Кіру'; });
$('#bLesson').addEventListener('click', e => { e.preventDefault(); window.open(lessonPath() + '#t=' + encodeURIComponent(TOK), '_blank'); });
$('#bOut').addEventListener('click', e => { e.preventDefault(); out(); });
function start(){ $('#login').hidden = true; $('#app').hidden = false; $('#topnav').hidden = false; loadLive(true); loadRoster(); }
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { TAB = b.dataset.t; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b)); document.querySelectorAll('.sec').forEach(s => s.classList.toggle('on', s.id === 's-' + TAB)); if (TAB === 'journal') loadJournal(); if (TAB === 'roster') loadRoster(); if (TAB === 'wrap') loadWrap(); if (TAB === 'plan') loadPlan(); }));

/* ---------- Пәндер мен тақырыптар: барлық ереже бір жерде ---------- */
/* att — кіргенге түсетін балл, tasks — тапсырма саны, min — әдепкі жұмыс уақыты, ai — ЖИ бағасы бар ма, py — қатемен жұмыс кезеңі бар ма */
const SUBJ = [
  { id: 'sm', name: 'Сандық әдістер', ico: '∑', topics: [
    { id: '6', n: 6, title: 'Гаусс–Зейдель әдісі', path: '/sandyq-adister/06-gauss-seidel', min: 30, tasks: 3, att: 40, ai: true },
    { id: '7', n: 7, title: 'Функцияны аппроксимациялау', path: '/sandyq-adister/07-approksimaciya', min: 35, tasks: 3, att: 40, ai: true }] },
  { id: 'akt', name: 'АКТ', ico: '💻', topics: [
    { id: 'A2', n: 2, title: 'Компьютер архитектурасы', path: '/akt/02-kompyuter', min: 60, tasks: 4, att: 30 },
    { id: '10', n: 10, title: 'Excel: сілтеме түрлері', path: '/akt/10-silteme-turleri', min: 60, tasks: 3, att: 40 },
    { id: 'A13', n: 13, title: 'Мультимедиа: куиз-презентация', path: '/akt/13-multimedia', min: 50, tasks: 3, att: 30 }] },
  { id: 'sb', name: 'Scratch', ico: '🎮', topics: [
    { id: 'S7', n: 7, title: 'Циклдер: «Кедергіден өт»', path: '/scratch/07-ciklder', min: 50, tasks: 3, att: 40 }] },
  { id: 'py', name: 'Python', ico: '🐍', topics: [
    { id: 'P4', n: 4, title: 'Арифметикалық операторлар', path: '/python/04-arifmetika', min: 50, tasks: 5, tl: [1, 2, 3, 4, 5], att: 0, py: true },
    { id: 'P7', n: 7, title: 'if шарты операторы', path: '/python/07-if-operatory', min: 60, tasks: 4, att: 0, py: true },
    { id: 'P8', n: 8, title: 'if–else және elif', path: '/python/08-if-else-elif', min: 60, tasks: 3, att: 0, py: true }] }
];
const TP = {}; SUBJ.forEach(s => s.topics.forEach(t => { TP[t.id] = { ...t, subj: s }; }));
const TL = ti => ti.tl || Array.from({ length: ti.tasks }, (_, i) => i + 1);   /* тапсырма нөмірлері (кейбір сабақта 2 және 4 кейін қосылады) */
const tinfo = id => TP[id] || { id, n: id, title: String(id), subj: { id: '', name: '' }, path: '/', min: 30, tasks: 3, att: 40 };
const tname = id => { const t = tinfo(id); return (t.subj.name ? t.subj.name + ' · ' : '') + t.n + '-тақырып: ' + t.title; };
const tshort = id => { const t = tinfo(id); return (t.subj.name ? t.subj.name + ' ' : '') + t.n; };
const fdate = t => { const d = new Date(t * 1000), p = n => String(n).padStart(2, '0'); return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); };
const download = (name, text) => { const a = h('a', { href: URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' })), download: name }); document.body.append(a); a.click(); a.remove(); };
const csv = rows => rows.map(r => r.map(v => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
let STF = '', SESS = { t: 0, rows: null, busy: false, g: '', s: '' }, LS = {};
try { LS = JSON.parse(sessionStorage.getItem('tstart') || '{}'); } catch (e) {}

/* ---------- Сабақ (live) ---------- */
async function loadLive(force){ if (busy || !TOK) return; busy = true; const j = await api('live' + (VIEW ? '?session=' + VIEW : '')); busy = false; if (j.ok) { LIVE = j; const a = document.activeElement; if (!force && a && a.closest && a.closest('#s-live') && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) { tickTimer(); return; } renderLive(); } }
setInterval(() => { if (TOK && !document.hidden && TAB === 'live') loadLive(); }, 3000);
setInterval(() => { if (LIVE && LIVE.session && TAB === 'live') tickTimer(); }, 1000);
const lessonPath = () => tinfo(LIVE && LIVE.session ? LIVE.session.topic : '6').path;
function openPj(){ const u = location.origin + lessonPath(); $('#pjUrl').textContent = u; $('#pj').hidden = false; document.body.style.overflow = 'hidden'; fillPj(); }
function closePj(){ $('#pj').hidden = true; document.body.style.overflow = ''; }
function fillPj(){ if ($('#pj').hidden || !LIVE || !LIVE.session) return; $('#pjCode').textContent = LIVE.session.code || ''; $('#pjTtl').textContent = 'Код ' + mmss(600 - (Math.floor(Date.now() / 1000 + skew) % 600)) + ' минуттан кейін өзгереді'; }
$('#pjX').addEventListener('click', closePj); document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#pj').hidden) closePj(); });
function tickTimer(){
  fillPj();
  const t = $('#timer'), ses = LIVE.session;
  if (t && ses.work_until) {
    const nowS = Date.now() / 1000 + skew, left = Math.floor(ses.work_until - nowS);
    if (left > 0) { t.textContent = '⏱ ' + mmss(left); t.classList.toggle('late', left <= 300); }
    else if (tinfo(ses.topic).py && nowS < ses.work_until + 900) { t.textContent = '🔁 Қатемен жұмыс ' + mmss(Math.floor(ses.work_until + 900 - nowS)); t.classList.remove('late'); }
    else { t.textContent = '⏱ Уақыт бітті'; t.classList.add('late'); }
  }
  const c = $('#codettl'); if (c) c.textContent = 'Код ' + mmss(600 - (Math.floor(Date.now() / 1000 + skew) % 600)) + ' минуттан кейін өзгереді';
}

/* 8-сабақ: жұптарды құру және «Сандық» ойынын тікелей бақылау */
const PSEL = new Set();
function pairCard(ses){
  const open = ses.status === 'open', free = LIVE.free || [], pairs = (LIVE.pairs || []).slice(), box = h('div', { class: 'card' });
  [...PSEL].forEach(id => { if (!free.some(f => f.id === id)) PSEL.delete(id); });
  const act = async (p, body) => { const j = await api(p, Object.assign({ session_id: ses.id }, body || {})); if (!j.ok) alert(j.error === 'taken' ? 'Бұл студент қазір бос емес.' : j.error === 'started' ? 'Бұл жұп жұмысты бастап қойған, бұзуға болмайды.' : 'Қате болды.'); PSEL.clear(); loadLive(true); };

/* ---------- Топтар мен студенттер ---------- */
async function loadRoster(){ const j = await api('roster'); if (j.ok) { ROSTER = j.groups; renderRoster(); } }
function setRoster(j){ if (j.ok) { ROSTER = j.groups; renderRoster(); loadLive(true); } }
function renderRoster(){
  const root = $('#s-roster'); root.innerHTML = '';
  const gn = h('input', { class: 'field', placeholder: 'Топ атауы, мысалы ИС-21', style: 'max-width:280px' });
  root.append(h('div', { class: 'card' }, [h('h2', { text: 'Жаңа топ' }), h('div', { class: 'row' }, [gn, h('button', { class: 'btn primary', text: '+ Топ қосу', on: { click: async () => { if (gn.value.trim()) setRoster(await api('groups', { name: gn.value })); } } })])]));
  ROSTER.forEach(g => {
    const names = h('textarea', { class: 'field', rows: '4', placeholder: 'Студенттердің аты-жөнін әр жолға бір-бірден қойыңыз (нөмірлері болса, автоматты алынады)' });
    root.append(h('div', { class: 'card' }, [
      h('div', { class: 'row' }, [h('h2', { text: g.name, style: 'margin:0' }), h('span', { class: 'sub', text: g.students.filter(s => s.active).length + ' студент' }), h('span', { class: 'sp' }),
        h('button', { class: 'btn sm', text: '✎ Атын өзгерту', on: { click: async () => { const n = prompt('Топтың жаңа атауы', g.name); if (n) setRoster(await api('groups/' + g.id, { name: n }, 'PATCH')); } } }),
        h('button', { class: 'btn sm danger', text: 'Топты жою', on: { click: async () => { if (confirm(g.name + ' тобын және оның студенттерінің барлық деректерін жоясыз ба?')) setRoster(await api('groups/' + g.id, null, 'DELETE')); } } })]),
      g.students.length ? h('div', { class: 'tw', style: 'margin:12px 0' }, h('table', { class: 't' }, [h('tbody', {}, g.students.map((s, i) => h('tr', { class: s.active ? '' : 'absent' }, [
        h('td', { text: String(i + 1), style: 'width:40px' }), h('td', { class: 'l', text: s.name + (s.active ? '' : ' (жасырылған)') }),
        h('td', { style: 'text-align:right' }, [h('button', { class: 'btn sm', text: '✎', title: 'Атын өзгерту', on: { click: async () => { const n = prompt('Аты-жөні', s.name); if (n) setRoster(await api('students/' + s.id, { name: n }, 'PATCH')); } } }), ' ',
          h('button', { class: 'btn sm', text: s.active ? 'Жасыру' : 'Қайтару', on: { click: async () => setRoster(await api('students/' + s.id, { active: !s.active }, 'PATCH')) } }), ' ',
          h('button', { class: 'btn sm danger', text: '🗑', title: 'Өшіру', on: { click: async () => { if (confirm(s.name + ' өшірілсін бе? Оның жұмыстары да өшеді.')) setRoster(await api('students/' + s.id, null, 'DELETE')); } } })])])))])) : h('p', { class: 'sub', text: 'Студент жоқ. Төменге тізімді қойыңыз.' }),
      names, h('div', { class: 'row', style: 'margin-top:8px' }, [h('button', { class: 'btn primary', text: '+ Студенттерді қосу', on: { click: async () => { if (names.value.trim()) setRoster(await api('students', { group_id: g.id, names: names.value })); } } })])]));
  });
}

/* ---------- Журнал ---------- */
let js = '', jq = '', jsort = 'name';
async function loadJournal(){ const j = await api('journal'); if (j.ok) { JOUR = j; renderJournal(); } }
/* бағандар: алдымен пән бойынша, сосын тақырып нөмірі бойынша */
function jTopics(){
  const ord = id => { const t = TP[id]; return t ? SUBJ.indexOf(t.subj) * 1000 + (+t.n || 0) : 9999; };
  return JOUR.topics.slice().sort((a, b) => ord(a) - ord(b)).filter(t => !js || (TP[t] && TP[t].subj.id === js));
}
const jTaken = sc => !!(sc && (sc.present || sc.sent));
function jRows(){
  const T = jTopics(), q = jq.trim().toLowerCase();
  const rows = JOUR.groups.filter(g => !jf || String(g.id) === jf).flatMap(g => g.students.map(s => {
    const got = T.map(t => s.scores[t]).filter(jTaken), avg = got.length ? Math.round(got.reduce((a, x) => a + x.total, 0) / got.length) : null;
    return { g: g.name, s, avg, n: got.length };
  })).filter(r => !q || r.s.name.toLowerCase().includes(q));
  if (jsort === 'avg') rows.sort((a, b) => (b.avg === null ? -1 : b.avg) - (a.avg === null ? -1 : a.avg) || a.s.name.localeCompare(b.s.name, 'kk'));
  else rows.sort((a, b) => a.g.localeCompare(b.g, 'kk') || a.s.name.localeCompare(b.s.name, 'kk'));
  return rows;
}
function jTable(){ const T = jTopics(); return [['Аты-жөні', 'Тобы'].concat(T.map(tname)).concat(['Орташа'])].concat(jRows().map(r => [r.s.name, r.g].concat(T.map(t => jTaken(r.s.scores[t]) ? r.s.scores[t].total : '')).concat([r.avg === null ? '' : r.avg]))); }
function renderJournal(){
  const root = $('#s-journal'); root.innerHTML = '';
  if (!JOUR.topics.length) { root.append(h('div', { class: 'card' }, h('p', { text: 'Әлі сабақ өткен жоқ.' }))); return; }
  const T = jTopics(), rows = jRows();
  const opt = (v, t, cur) => h('option', { value: v, text: t, selected: cur === v ? 'selected' : false });
  const subjSel = h('select', { class: 'field', style: 'max-width:200px', 'aria-label': 'Пән', on: { change: e => { js = e.target.value; renderJournal(); } } }, [opt('', 'Барлық пән', js)].concat(SUBJ.filter(s => JOUR.topics.some(t => TP[t] && TP[t].subj.id === s.id)).map(s => opt(s.id, s.ico + ' ' + s.name, js))));
  const grpSel = h('select', { class: 'field', style: 'max-width:200px', 'aria-label': 'Топ', on: { change: e => { jf = e.target.value; renderJournal(); } } }, [opt('', 'Барлық топ', jf)].concat(JOUR.groups.map(g => opt(String(g.id), g.name, jf))));
  const srt = h('select', { class: 'field', style: 'max-width:200px', 'aria-label': 'Реттеу', on: { change: e => { jsort = e.target.value; renderJournal(); } } }, [opt('name', 'Аты бойынша', jsort), opt('avg', 'Орташа балл бойынша', jsort)]);
  const q = h('input', { class: 'field', type: 'search', placeholder: 'Студентті іздеу…', value: jq, style: 'max-width:220px', 'aria-label': 'Іздеу', on: { input: e => { jq = e.target.value; const pos = e.target.selectionStart; renderJournal(); const n = $('#s-journal input[type=search]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } } } });
  root.append(h('div', { class: 'row', style: 'margin-bottom:12px' }, [subjSel, grpSel, srt, q, h('span', { class: 'sp' }),
    h('button', { class: 'btn', text: '📋 Көшіру', on: { click: async e => { try { await navigator.clipboard.writeText(jTable().map(r => r.join('\t')).join('\n')); e.target.textContent = '✓ Көшірілді'; } catch (x) { e.target.textContent = 'Көшіру мүмкін болмады'; } } } }),
    h('button', { class: 'btn', text: '⬇ CSV', on: { click: () => download('журнал.csv', csv(jTable())) } })]));
  root.append(h('div', { class: 'legend' }, [['90+', '#b7e1c1'], ['75–89', '#dcefc8'], ['60–74', '#fff1b8'], ['60-тан төмен', '#ffd6cc'], ['сабаққа келмеген', '#f3f4f6']].map(([t, c]) => h('span', { class: 'lg' }, [h('i', { style: 'background:' + c }), t])).concat([h('span', { class: 'sub', style: 'display:inline;margin-left:8px', text: 'Ұяшықты басып, студенттің жұмысын ашуға болады. ✎ — оқытушы баллы.' })])));
  if (!T.length || !rows.length) { root.append(h('div', { class: 'card' }, h('p', { text: !T.length ? 'Бұл пән бойынша сабақ өткен жоқ.' : 'Іздеу бойынша студент табылмады.' }))); return; }
  const cell = (sc, stu) => {
    if (!jTaken(sc)) return h('td', { style: 'background:#f3f4f6' }, h('span', { class: 'sub', text: 'жоқ' }));
    const ti = tinfo(sc.topic), bits = []; if (ti.att) bits.push('қатысым ' + sc.attendance); if (!sc.complete) bits.push(sc.sent + '/' + TL(ti).length + ' тапсырма');
    return h('td', { class: 'jc', title: 'Жұмысын ашу', style: 'background:' + band(sc.total), on: { click: () => openDetail(sc.session, stu.id) } }, [h('b', { text: String(sc.total) }), sc.edited ? h('span', { class: 'sub mark', text: '✎' }) : '', bits.length ? h('span', { class: 'sub', text: bits.join(' · ') }) : '']);
  };
  const head = [h('th', { text: '№' }), h('th', { class: 'l', text: 'Студент' }), h('th', { text: 'Топ' })].concat(T.map(t => h('th', { title: tname(t) }, [h('span', { text: tshort(t) }), h('span', { class: 'sub thsub', text: tinfo(t).title })]))).concat([h('th', { text: 'Орташа' })]);
  const body = rows.map((r, i) => h('tr', {}, [h('td', { text: String(i + 1) }), h('td', { class: 'l', text: r.s.name }), h('td', { text: r.g })].concat(T.map(t => cell(r.s.scores[t], r.s))).concat([h('td', { style: 'font-weight:700;background:' + band(r.avg === null ? '' : r.avg), text: r.avg === null ? '—' : String(r.avg) })])));
  const foot = h('tr', { class: 'foot' }, [h('td', { text: '' }), h('td', { class: 'l', text: 'Топ орташасы (келгендер)' }), h('td', { text: '' })].concat(T.map(t => { const v = rows.map(r => r.s.scores[t]).filter(jTaken).map(x => x.total); return h('td', { text: v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) + ' (' + v.length + ')' : '—' }); })).concat([h('td', { text: '' })]));
  root.append(h('div', { class: 'tw jt' }, h('table', { class: 't' }, [h('thead', {}, h('tr', {}, head)), h('tbody', {}, body), h('tfoot', {}, foot)])));
}

if (TOK) start();
})();
</script>
</body>
