<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Оқытушы панелі</title>
<link rel="stylesheet" href="../assets/site.css">
<style>
.t-main{padding:24px 0 60px}
.login{max-width:460px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:var(--shadow)}
.login h1{font-size:1.9rem;margin:0 0 6px}.login p{color:var(--muted);margin:0 0 20px}
.field{width:100%;min-height:46px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);font:inherit;background:var(--surface);color:var(--text)}
.field:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.btn{font:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--primary)}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.9rem}.btn.danger{color:#b91c1c}.btn:disabled{opacity:.5;cursor:wait}
.err{color:#b91c1c;min-height:1.4em;margin:10px 0 0}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;min-height:44px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted)}
.tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:1.25rem}
.code{font-size:4.2rem;font-weight:800;letter-spacing:.12em;color:var(--primary-2);line-height:1.1;font-family:ui-monospace,Consolas,monospace}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.stats4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat4{background:var(--surface-2);border-radius:14px;padding:12px 16px}.stat4 b{display:block;font-size:1.8rem;line-height:1.1;color:var(--primary-2)}.stat4 span{color:var(--muted);font-size:.9rem}
.timer{font-size:2rem;font-weight:800;font-family:ui-monospace,Consolas,monospace}.timer.late{color:#b91c1c}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:.95rem}
.t th{background:#0f3a73;color:#fff;font-weight:600;padding:10px;text-align:center;white-space:nowrap}
.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.t td.l,.t th.l{text-align:left}
.t tr.absent td{background:#f3f4f6;color:var(--muted)}.t tr.red td{background:#fde2e2}.t tr.org td{background:#ffe8cc}
.pill{display:inline-block;min-width:3em;padding:2px 10px;border-radius:999px;font-weight:700}
.sub{display:block;color:var(--muted);font-size:.82rem}.mark{color:#15803d;font-weight:700}
.gh{display:flex;gap:10px;align-items:center;margin:18px 0 8px}.gh h3{margin:0;font-size:1.1rem}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.45);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:20px 12px}
.overlay[hidden]{display:none}
.panel{background:var(--bg);border-radius:22px;width:min(1280px,100%);box-shadow:0 20px 60px rgba(15,23,42,.35)}
.p-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 22px;background:var(--surface);border-radius:22px 22px 0 0;border-bottom:1px solid var(--line)}
.p-head h2{margin:0;font-size:1.35rem}.sp{flex:1}
.p-body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;padding:18px 22px 24px}
@media (max-width:900px){.p-body{grid-template-columns:1fr;padding:12px}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.box h3{margin:0 0 8px;font-size:1rem;color:var(--primary-2)}
.box pre{margin:0 0 8px;white-space:pre-wrap;word-break:break-word;font:.9rem/1.5 ui-monospace,Consolas,monospace;max-height:300px;overflow:auto;background:#F1F5F9;border-radius:10px;padding:8px 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.93rem}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.aibox{border-left:4px solid var(--primary);background:var(--primary-soft);border-radius:10px;padding:8px 12px;margin:8px 0}
.edit{border:2px solid var(--primary);background:#F8FBFF}
.edit label{display:block;font-weight:600;margin:8px 0 4px;font-size:.92rem}
.msg{min-height:1.4em;margin-top:8px;font-weight:600}.ok{color:#15803d}.bad{color:#b91c1c}
.big{font-size:1.5rem;font-weight:800;text-align:center;max-width:7em}
textarea.field{min-height:6em}
.qs{margin:6px 0 10px;padding-left:1.3em;font-size:1.15rem}.qs li{margin:6px 0}.qs li.cur{font-weight:700;color:var(--primary-2)}
.wheel-wrap{position:relative;width:min(380px,100%);margin:6px auto}
.wheel-wrap canvas{width:100%;height:auto;display:block;border-radius:50%;box-shadow:0 8px 28px rgba(15,23,42,.18)}
.pointer{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid #dc2626;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));z-index:2}
.winner{background:var(--primary-soft);border:2px solid var(--primary);border-radius:16px;padding:16px 18px;margin-top:14px}
.winner h3{margin:0 0 4px;font-size:1.4rem}.winner .q{font-size:1.2rem;font-weight:700;margin:8px 0}
.bar5{display:grid;grid-template-columns:70px 1fr 36px;gap:8px;align-items:center;margin:6px 0}
.bar5 .b{height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}.bar5 .b i{display:block;height:100%;background:var(--primary)}
.cmt{border-top:1px solid var(--line);padding:8px 0}
.qr{margin-top:10px}.qr summary{cursor:pointer;font-weight:600;color:var(--primary-2);min-height:40px;display:flex;align-items:center}.qr img{display:block;margin:8px auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.sec{display:none}.sec.on{display:block}
</style>
</head>
<body>
<header class="site-head">
  <div class="wrap head-in"><span class="logo"><span class="logo-mark">ББ</span><span>Оқытушы панелі</span></span>
    <nav class="head-nav" id="topnav" hidden><a href="#" id="bOut">Шығу</a></nav></div>
</header>
<main class="wrap t-main">
  <section id="login" class="login">
    <h1>Оқытушы панелі</h1>
    <p>Құпиясөзді енгізіңіз.</p>
    <form id="fLogin"><input class="field" id="pw" type="password" placeholder="Құпиясөз" autocomplete="current-password" required>
      <div class="err" id="eLogin" role="alert"></div>
      <button class="btn primary" id="bLogin" type="submit" style="width:100%;margin-top:6px">Кіру</button></form>
  </section>
  <div id="app" hidden>
    <div class="tabs" id="tabs"><button class="tab on" data-t="live">📡 Сабақ</button><button class="tab" data-t="wrap">🎯 Бекіту</button><button class="tab" data-t="roster">👥 Топтар мен студенттер</button><button class="tab" data-t="journal">📒 Журнал</button></div>
    <section class="sec on" id="s-live"></section>
    <section class="sec" id="s-wrap"></section>
    <section class="sec" id="s-roster"></section>
    <section class="sec" id="s-journal"></section>
  </div>
</main>
<div class="overlay" id="ov" hidden><div class="panel" id="panel"></div></div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const h = (tag, a, kids) => { const e = document.createElement(tag); for (const k in (a || {})) { if (k === 'text') e.textContent = a[k]; else if (k === 'class') e.className = a[k]; else if (k === 'on') { for (const ev in a[k]) e.addEventListener(ev, a[k][ev]); } else if (a[k] !== false && a[k] !== undefined) e.setAttribute(k, a[k]); } [].concat(kids === undefined ? [] : kids).forEach(c => { if (c !== null && c !== undefined && c !== false) e.append(c); }); return e; };
let QROPEN = false, TOK = '', LIVE = null, ROSTER = [], JOUR = null, TAB = 'live', DETAIL = null, busy = false, gFilter = '', jf = '', skew = 0, WMIN = 30, wDirty = false;
try { TOK = sessionStorage.getItem('ttok') || ''; } catch (e) {}
const band = v => v === '' || v === null || v === undefined ? '#e2e8f0' : v >= 90 ? '#b7e1c1' : v >= 75 ? '#dcefc8' : v >= 60 ? '#fff1b8' : '#ffd6cc';
const has = v => v !== '' && v !== null && v !== undefined;
const mmss = s => Math.floor(Math.max(0, s) / 60) + ':' + String(Math.max(0, s) % 60).padStart(2, '0');
const hhmm = t => { const d = new Date(t * 1000), p = n => String(n).padStart(2, '0'); return p(d.getHours()) + ':' + p(d.getMinutes()); };

async function api(path, body, method){
  try {
    const r = await fetch('/api/teacher/' + path, { method: method || (body ? 'POST' : 'GET'), headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOK }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json(); if (r.status === 401) { out(); return { ok: false, error: 'auth' }; } return j;
  } catch (e) { return { ok: false, error: 'network' }; }
}

/* ---------- Кіру ---------- */
async function login(pw){
  let j; try { j = await (await fetch('/api/teacher/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) })).json(); } catch (e) { j = { error: 'network' }; }
  if (!j.ok) { $('#eLogin').textContent = j.error === 'bad_password' ? 'Құпиясөз дұрыс емес.' : j.error === 'no_password' ? 'Құпиясөз бапталмаған: Cloudflare-де TEACHER_PASSWORD қосыңыз.' : j.error === 'wait' ? 'Қате көп болды. 10 минуттан кейін қайта көріңіз.' : 'Серверге қосыла алмады.'; return false; }
  TOK = j.token; try { sessionStorage.setItem('ttok', TOK); } catch (e) {} start(); return true;
}
function out(){ TOK = ''; try { sessionStorage.removeItem('ttok'); } catch (e) {} $('#app').hidden = true; $('#topnav').hidden = true; $('#login').hidden = false; $('#pw').value = ''; closeDetail(); }
$('#fLogin').addEventListener('submit', async e => { e.preventDefault(); $('#eLogin').textContent = ''; const b = $('#bLogin'); b.disabled = true; b.textContent = 'Тексеріп жатыр…'; await login($('#pw').value); b.disabled = false; b.textContent = 'Кіру'; });
$('#bOut').addEventListener('click', e => { e.preventDefault(); out(); });
function start(){ $('#login').hidden = true; $('#app').hidden = false; $('#topnav').hidden = false; loadLive(true); loadRoster(); }
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { TAB = b.dataset.t; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b)); document.querySelectorAll('.sec').forEach(s => s.classList.toggle('on', s.id === 's-' + TAB)); if (TAB === 'journal') loadJournal(); if (TAB === 'roster') loadRoster(); if (TAB === 'wrap') loadWrap(); }));

/* ---------- Сабақ (live) ---------- */
async function loadLive(force){ if (busy || !TOK) return; busy = true; const j = await api('live'); busy = false; if (j.ok) { LIVE = j; const a = document.activeElement; if (!force && a && a.closest && a.closest('#s-live') && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) { tickTimer(); return; } renderLive(); } }
setInterval(() => { if (TOK && !document.hidden && TAB === 'live') loadLive(); }, 3000);
setInterval(() => { if (LIVE && LIVE.session && TAB === 'live') tickTimer(); }, 1000);
function tickTimer(){
  const t = $('#timer');
  if (t && LIVE.session.work_until) { const left = Math.floor(LIVE.session.work_until - (Date.now() / 1000 + skew)); t.textContent = left > 0 ? '⏱ ' + mmss(left) : '⏱ Уақыт бітті'; t.classList.toggle('late', left <= 300); }
  const c = $('#codettl'); if (c) c.textContent = 'Код ' + (60 - (Math.floor(Date.now() / 1000 + skew) % 60)) + ' секундтан кейін өзгереді';
}
function renderLive(){
  const root = $('#s-live'), ses = LIVE.session; skew = LIVE.now - Date.now() / 1000;
  const keep = window.scrollY; root.innerHTML = '';
  const open = ses && ses.status === 'open';
  const groups = LIVE.groups.filter(g => !gFilter || String(g.id) === gFilter);
  const all = LIVE.groups.flatMap(g => g.students.filter(s => s.active !== false));
  const present = all.filter(s => s.present).length, done = all.filter(s => s.complete).length;
  if (!open) {
    const topic = h('select', { class: 'field', style: 'max-width:220px' }, [h('option', { value: '6', text: '6-тақырып' })]);
    root.append(h('div', { class: 'card' }, [h('h2', { text: 'Жаңа сабақ' }), h('p', { class: 'sub', text: LIVE.groups.length ? 'Сабақты бастағанда студенттерге көрсетілетін 4 таңбалы код пайда болады.' : 'Алдымен «Топтар мен студенттер» бөлімінде топ пен студенттерді қосыңыз.' }),
      h('div', { class: 'row' }, [topic, h('button', { class: 'btn primary', text: '▶ Сабақты бастау', on: { click: async () => { await api('session/start', { topic: topic.value }); loadLive(true); } } })])]));
    if (ses) root.append(h('p', { class: 'sub', text: 'Соңғы сабақ жабылған. Төменде оның нәтижесі.' }));
  } else {
    const ctl = h('div', { class: 'row' }), started = !!ses.work_until;
    if (!wDirty) WMIN = started && ses.work_started_at ? Math.max(1, Math.round((ses.work_until - ses.work_started_at) / 60)) : 30;
    const mins = h('input', { class: 'field', type: 'number', value: String(WMIN), min: '1', max: '240', style: 'width:90px', 'aria-label': 'Жұмыс ұзақтығы, минут', on: { input: e => { WMIN = +e.target.value || 30; wDirty = true; } } });
    if (!started) ctl.append(h('span', { text: 'Жұмыс ұзақтығы:' }), mins, h('span', { text: 'мин' }), h('button', { class: 'btn primary', text: '▶ Жұмысты бастау', on: { click: async () => { wDirty = false; await api('session/work', { minutes: WMIN }); loadLive(true); } } }));
    else ctl.append(h('div', { class: 'timer', id: 'timer' }), h('span', { text: 'ұзақтығы:' }), mins, h('span', { text: 'мин' }),
      h('button', { class: 'btn sm', text: 'Өзгерту', on: { click: async () => { wDirty = false; await api('session/work', { minutes: WMIN, total: true }); loadLive(true); } } }),
      h('button', { class: 'btn sm', text: '+5 мин', on: { click: async () => { wDirty = false; await api('session/work', { minutes: 5, extend: true }); loadLive(true); } } }),
      h('button', { class: 'btn sm', text: '⏹ Тоқтату', on: { click: async () => { await api('session/stopwork', {}); loadLive(true); } } }));
    ctl.append(h('span', { class: 'sp' }), h('button', { class: 'btn sm danger', text: 'Сабақты жабу', on: { click: async () => { if (confirm('Сабақты жабасыз ба? Студенттер енді кіре алмайды.')) { await api('session/close', {}); loadLive(true); } } } }));
    root.append(h('div', { class: 'grid2' }, [
      h('div', { class: 'card' }, [h('h2', { text: 'Сабаққа кіру коды' }), h('div', { class: 'code', text: ses.code }), h('p', { class: 'sub', id: 'codettl', style: 'margin:4px 0 8px' }), h('p', { class: 'sub', text: 'Студенттер сабақ бетіндегі «Сабаққа кіру» батырмасын басып, топты, атын таңдап, осы кодты енгізеді. Код әр минут сайын өзгереді, сондықтан келмеген студентке жіберіп жібере алмайды. Кіргендерге 40 балл автоматты түседі.' }),
        h('details', { class: 'qr', open: QROPEN ? 'open' : false, on: { toggle: e => { QROPEN = e.target.open; } } }, [h('summary', { text: '📱 Сабаққа QR-код' }), h('img', { src: 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=8&data=' + encodeURIComponent(location.origin + '/sandyq-adister/06-gauss-seidel'), width: '240', height: '240', alt: 'QR-код: сабақ беті' }), h('p', { class: 'sub', style: 'text-align:center', text: location.origin + '/sandyq-adister/06-gauss-seidel' })])]),
      h('div', { class: 'card' }, [h('h2', { text: 'Сабақ барысы' }), h('div', { class: 'stats4' }, [['Бар', present], ['Жоқ', all.length - present], ['Жұмысты бітірді', done]].map(([l, v]) => h('div', { class: 'stat4' }, [h('b', { text: String(v) }), h('span', { text: l })]))), h('div', { style: 'margin-top:14px' }, ctl)])]));
  }
  root.append(h('div', { class: 'row', style: 'margin:6px 0' }, [h('select', { class: 'field', style: 'max-width:240px', 'aria-label': 'Топ', on: { change: e => { gFilter = e.target.value; renderLive(); } } }, [h('option', { value: '', text: 'Барлық топ' })].concat(LIVE.groups.map(g => h('option', { value: String(g.id), text: g.name, selected: gFilter === String(g.id) ? 'selected' : false })))), ses ? h('span', { class: 'sub', text: ses.topic + '-тақырып · ' + hhmm(ses.created_at) + ' басталған' }) : '']));
  groups.forEach(g => {
    const rows = g.students.filter(s => s.active !== false).map(s => {
      const cls = !s.present ? 'absent' : s.ai_pct >= 50 ? 'red' : s.ai_pct >= 30 ? 'org' : '';
      const tc = n => { const t = s.tasks && s.tasks[n]; return h('td', { text: !t || !t.sent ? '—' : t.pending ? t.pts + '…' : t.pts + '/' + t.max }); };
      return h('tr', { class: cls }, [
        h('td', { class: 'l' }, [h('b', { text: s.name }), s.present ? h('span', { class: 'sub', text: hhmm(s.joined_at) + (s.manual ? ' · қолмен' : '') }) : '']),
        h('td', { text: s.present ? '✓ 40' : 'жоқ' }), h('td', { text: s.present ? '№' + s.variant : '' }), tc(1), tc(2), tc(3),
        h('td', {}, s.present && s.ai_pct ? h('span', { class: 'pill', style: 'background:' + (s.ai_pct >= 50 ? '#fecaca' : s.ai_pct >= 30 ? '#fed7aa' : '#bbf7d0'), text: s.ai_pct + '%' }) : '—'),
        h('td', {}, s.present ? [h('span', { class: 'pill', style: 'background:' + band(s.total), text: String(s.total) }), s.edited ? h('span', { class: 'sub mark', text: '✎' }) : ''] : '—'),
        h('td', {}, s.present ? [h('button', { class: 'btn sm', text: 'Ашу', on: { click: () => openDetail(ses.id, s.id) } }), ' ', s.device ? h('button', { class: 'btn sm', title: 'Басқа құрылғыдан кіруге рұқсат', text: '📱', on: { click: async () => { await api('release', { session_id: ses.id, student_id: s.id }); loadLive(true); } } }) : '']
          : (ses ? h('button', { class: 'btn sm', text: '✓ Келді', on: { click: async () => { await api('attendance', { session_id: ses.id, student_id: s.id, present: true }); loadLive(true); } } }) : ''))
      ]);
    });
    root.append(h('div', { class: 'gh' }, [h('h3', { text: g.name }), h('span', { class: 'sub', text: g.students.filter(s => s.present).length + ' / ' + g.students.length + ' бар' })]),
      g.students.length ? h('div', { class: 'tw' }, h('table', { class: 't' }, [h('thead', {}, h('tr', {}, ['Студент', 'Қатысым', 'Нұсқа', '1', '2', '3', 'ЖИ', 'Балл', ''].map((c, i) => h('th', { class: i === 0 ? 'l' : '', text: c })))), h('tbody', {}, rows)])) : h('p', { class: 'sub', text: 'Бұл топта студент жоқ.' }));
  });
  window.scrollTo(0, keep); if (ses) tickTimer();
}

/* ---------- Студенттің толық жұмысы ---------- */
async function openDetail(sid, stu){ DETAIL = { sid, stu }; const j = await api('work?session=' + sid + '&student=' + stu); if (!j.ok) return; paintDetail(j); $('#ov').hidden = false; document.body.style.overflow = 'hidden'; }
function closeDetail(){ DETAIL = null; $('#ov').hidden = true; document.body.style.overflow = ''; }
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov') closeDetail(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && DETAIL) closeDetail(); });
async function reDetail(note){ const j = await api('work?session=' + DETAIL.sid + '&student=' + DETAIL.stu); if (j.ok) { paintDetail(j); if (note) { const m = $('#panel .msg'); if (m) { m.className = 'msg ok'; m.textContent = note; } } } loadLive(true); }
const pre = (t, v) => h('div', { class: 'box' }, [h('h3', { text: t }), h('pre', { text: v === '' || v === undefined || v === null ? '—' : String(v) })]);
function paintDetail(j){
  const P = $('#panel'); P.innerHTML = ''; const c = j.calc;

  const head = ['№', 'Студент', 'Топ'].concat(JOUR.topics.map(t => JOUR.titles[t])).map((c, i) => h('th', { class: i === 1 ? 'l' : '', text: c }));
  const body = rows.map((r, i) => h('tr', {}, [h('td', { text: String(i + 1) }), h('td', { class: 'l', text: r.s.name }), h('td', { text: r.g })].concat(JOUR.topics.map(t => cell(r.s.scores[t])))));
  root.append(h('div', { class: 'tw' }, h('table', { class: 't' }, [h('thead', {}, h('tr', {}, head)), h('tbody', {}, body)])));
}

if (TOK) start();
})();
</script>
</body>
