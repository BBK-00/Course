<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Оқытушы панелі</title>
<link rel="stylesheet" href="../assets/site.css">
<style>
.t-main{padding:24px 0 60px}
.login{max-width:460px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:var(--shadow)}
.login h1{font-size:1.9rem;margin:0 0 6px}.login p{color:var(--muted);margin:0 0 20px}
.field{width:100%;min-height:46px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);font:inherit;background:var(--surface);color:var(--text)}
.field:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.btn{font:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--primary)}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.9rem}.btn.danger{color:#b91c1c}.btn:disabled{opacity:.5;cursor:wait}
.err{color:#b91c1c;min-height:1.4em;margin:10px 0 0}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;min-height:44px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted)}
.tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:1.25rem}
.code{font-size:4.2rem;font-weight:800;letter-spacing:.12em;color:var(--primary-2);line-height:1.1;font-family:ui-monospace,Consolas,monospace}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.stats4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat4{background:var(--surface-2);border-radius:14px;padding:12px 16px}.stat4 b{display:block;font-size:1.8rem;line-height:1.1;color:var(--primary-2)}.stat4 span{color:var(--muted);font-size:.9rem}
.timer{font-size:2rem;font-weight:800;font-family:ui-monospace,Consolas,monospace}.timer.late{color:#b91c1c}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:.95rem}
.t th{background:#0f3a73;color:#fff;font-weight:600;padding:10px;text-align:center;white-space:nowrap}
.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.t td.l,.t th.l{text-align:left}
.t tr.absent td{background:#f3f4f6;color:var(--muted)}.t tr.red td{background:#fde2e2}.t tr.org td{background:#ffe8cc}
.pill{display:inline-block;min-width:3em;padding:2px 10px;border-radius:999px;font-weight:700}
.sub{display:block;color:var(--muted);font-size:.82rem}.mark{color:#15803d;font-weight:700}
.gh{display:flex;gap:10px;align-items:center;margin:18px 0 8px}.gh h3{margin:0;font-size:1.1rem}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.45);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:20px 12px}
.overlay[hidden]{display:none}
.panel{background:var(--bg);border-radius:22px;width:min(1280px,100%);box-shadow:0 20px 60px rgba(15,23,42,.35)}
.p-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 22px;background:var(--surface);border-radius:22px 22px 0 0;border-bottom:1px solid var(--line)}
.p-head h2{margin:0;font-size:1.35rem}.sp{flex:1}
.p-body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;padding:18px 22px 24px}
@media (max-width:900px){.p-body{grid-template-columns:1fr;padding:12px}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.box h3{margin:0 0 8px;font-size:1rem;color:var(--primary-2)}
.box pre{margin:0 0 8px;white-space:pre-wrap;word-break:break-word;font:.9rem/1.5 ui-monospace,Consolas,monospace;max-height:300px;overflow:auto;background:#F1F5F9;border-radius:10px;padding:8px 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.93rem}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.aibox{border-left:4px solid var(--primary);background:var(--primary-soft);border-radius:10px;padding:8px 12px;margin:8px 0}
.edit{border:2px solid var(--primary);background:#F8FBFF}
.edit label{display:block;font-weight:600;margin:8px 0 4px;font-size:.92rem}
.msg{min-height:1.4em;margin-top:8px;font-weight:600}.ok{color:#15803d}.bad{color:#b91c1c}
.big{font-size:1.5rem;font-weight:800;text-align:center;max-width:7em}
textarea.field{min-height:6em}
.sec{display:none}.sec.on{display:block}
</style>
</head>
<body>
<header class="site-head">
  <div class="wrap head-in"><span class="logo"><span class="logo-mark">ББ</span><span>Оқытушы панелі</span></span>
    <nav class="head-nav" id="topnav" hidden><a href="#" id="bOut">Шығу</a></nav></div>
</header>
<main class="wrap t-main">
  <section id="login" class="login">
    <h1>Оқытушы панелі</h1>
    <p>Құпиясөзді енгізіңіз.</p>
    <form id="fLogin"><input class="field" id="pw" type="password" placeholder="Құпиясөз" autocomplete="current-password" required>
      <div class="err" id="eLogin" role="alert"></div>
      <button class="btn primary" id="bLogin" type="submit" style="width:100%;margin-top:6px">Кіру</button></form>
  </section>
  <div id="app" hidden>
    <div class="tabs" id="tabs"><button class="tab on" data-t="live">📡 Сабақ</button><button class="tab" data-t="roster">👥 Топтар мен студенттер</button><button class="tab" data-t="journal">📒 Журнал</button></div>
    <section class="sec on" id="s-live"></section>
    <section class="sec" id="s-roster"></section>
    <section class="sec" id="s-journal"></section>
  </div>
</main>
<div class="overlay" id="ov" hidden><div class="panel" id="panel"></div></div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const h = (tag, a, kids) => { const e = document.createElement(tag); for (const k in (a || {})) { if (k === 'text') e.textContent = a[k]; else if (k === 'class') e.className = a[k]; else if (k === 'on') { for (const ev in a[k]) e.addEventListener(ev, a[k][ev]); } else if (a[k] !== false && a[k] !== undefined) e.setAttribute(k, a[k]); } [].concat(kids === undefined ? [] : kids).forEach(c => { if (c !== null && c !== undefined && c !== false) e.append(c); }); return e; };
let TOK = '', LIVE = null, ROSTER = [], JOUR = null, TAB = 'live', DETAIL = null, busy = false, gFilter = '', jf = '', skew = 0;
try { TOK = sessionStorage.getItem('ttok') || ''; } catch (e) {}
const band = v => v === '' || v === null || v === undefined ? '#e2e8f0' : v >= 90 ? '#b7e1c1' : v >= 75 ? '#dcefc8' : v >= 60 ? '#fff1b8' : '#ffd6cc';
const has = v => v !== '' && v !== null && v !== undefined;
const mmss = s => Math.floor(Math.max(0, s) / 60) + ':' + String(Math.max(0, s) % 60).padStart(2, '0');
const hhmm = t => { const d = new Date(t * 1000), p = n => String(n).padStart(2, '0'); return p(d.getHours()) + ':' + p(d.getMinutes()); };

async function api(path, body, method){
  try {
    const r = await fetch('/api/teacher/' + path, { method: method || (body ? 'POST' : 'GET'), headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOK }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json(); if (r.status === 401) { out(); return { ok: false, error: 'auth' }; } return j;
  } catch (e) { return { ok: false, error: 'network' }; }
}

/* ---------- Кіру ---------- */
async function login(pw){
  let j; try { j = await (await fetch('/api/teacher/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) })).json(); } catch (e) { j = { error: 'network' }; }
  if (!j.ok) { $('#eLogin').textContent = j.error === 'bad_password' ? 'Құпиясөз дұрыс емес.' : j.error === 'no_password' ? 'Құпиясөз бапталмаған: Cloudflare-де TEACHER_PASSWORD қосыңыз.' : j.error === 'wait' ? 'Қате көп болды. 10 минуттан кейін қайта көріңіз.' : 'Серверге қосыла алмады.'; return false; }
  TOK = j.token; try { sessionStorage.setItem('ttok', TOK); } catch (e) {} start(); return true;
}
function out(){ TOK = ''; try { sessionStorage.removeItem('ttok'); } catch (e) {} $('#app').hidden = true; $('#topnav').hidden = true; $('#login').hidden = false; $('#pw').value = ''; closeDetail(); }
$('#fLogin').addEventListener('submit', async e => { e.preventDefault(); $('#eLogin').textContent = ''; const b = $('#bLogin'); b.disabled = true; b.textContent = 'Тексеріп жатыр…'; await login($('#pw').value); b.disabled = false; b.textContent = 'Кіру'; });
$('#bOut').addEventListener('click', e => { e.preventDefault(); out(); });
function start(){ $('#login').hidden = true; $('#app').hidden = false; $('#topnav').hidden = false; loadLive(); loadRoster(); }
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { TAB = b.dataset.t; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b)); document.querySelectorAll('.sec').forEach(s => s.classList.toggle('on', s.id === 's-' + TAB)); if (TAB === 'journal') loadJournal(); if (TAB === 'roster') loadRoster(); }));

/* ---------- Сабақ (live) ---------- */
async function loadLive(){ if (busy || !TOK) return; busy = true; const j = await api('live'); busy = false; if (j.ok) { LIVE = j; renderLive(); } }
setInterval(() => { if (TOK && !document.hidden && TAB === 'live') loadLive(); }, 3000);
setInterval(() => { if (LIVE && LIVE.session && LIVE.session.work_until && TAB === 'live') tickTimer(); }, 1000);
function tickTimer(){ const t = $('#timer'); if (!t) return; const left = Math.floor(LIVE.session.work_until - (Date.now() / 1000 + skew)); t.textContent = left > 0 ? '⏱ ' + mmss(left) : '⏱ Уақыт бітті'; t.classList.toggle('late', left <= 300); }
function renderLive(){
  const root = $('#s-live'), ses = LIVE.session; skew = LIVE.now - Date.now() / 1000;
  const keep = window.scrollY; root.innerHTML = '';
  const open = ses && ses.status === 'open';
  const groups = LIVE.groups.filter(g => !gFilter || String(g.id) === gFilter);
  const all = LIVE.groups.flatMap(g => g.students.filter(s => s.active !== false));
  const present = all.filter(s => s.present).length, done = all.filter(s => s.complete).length;
  if (!open) {
    const topic = h('select', { class: 'field', style: 'max-width:220px' }, [h('option', { value: '6', text: '6-тақырып' })]);
    root.append(h('div', { class: 'card' }, [h('h2', { text: 'Жаңа сабақ' }), h('p', { class: 'sub', text: LIVE.groups.length ? 'Сабақты бастағанда студенттерге көрсетілетін 4 таңбалы код пайда болады.' : 'Алдымен «Топтар мен студенттер» бөлімінде топ пен студенттерді қосыңыз.' }),
      h('div', { class: 'row' }, [topic, h('button', { class: 'btn primary', text: '▶ Сабақты бастау', on: { click: async () => { await api('session/start', { topic: topic.value }); loadLive(); } } })])]));
    if (ses) root.append(h('p', { class: 'sub', text: 'Соңғы сабақ жабылған. Төменде оның нәтижесі.' }));
  } else {
    const ctl = h('div', { class: 'row' });
    if (!ses.work_until) {
      const mins = h('input', { class: 'field', type: 'number', value: '40', min: '1', max: '240', style: 'width:90px' });
      ctl.append(h('span', { text: 'Жұмыс уақыты:' }), mins, h('span', { text: 'мин' }), h('button', { class: 'btn primary', text: '▶ Жұмысты бастау', on: { click: async () => { await api('session/work', { minutes: +mins.value || 40 }); loadLive(); } } }));
    } else {
      ctl.append(h('div', { class: 'timer', id: 'timer' }), h('button', { class: 'btn sm', text: '+5 мин', on: { click: async () => { await api('session/work', { minutes: 5, extend: true }); loadLive(); } } }), h('button', { class: 'btn sm', text: '⏹ Жұмысты тоқтату', on: { click: async () => { await api('session/stopwork', {}); loadLive(); } } }));
    }
    ctl.append(h('span', { class: 'sp' }), h('button', { class: 'btn sm danger', text: 'Сабақты жабу', on: { click: async () => { if (confirm('Сабақты жабасыз ба? Студенттер енді кіре алмайды.')) { await api('session/close', {}); loadLive(); } } } }));
    root.append(h('div', { class: 'grid2' }, [
      h('div', { class: 'card' }, [h('h2', { text: 'Сабаққа кіру коды' }), h('div', { class: 'code', text: ses.code }), h('p', { class: 'sub', text: 'Студенттер сабақ бетіндегі «Сабаққа кіру» батырмасын басып, топты, атын таңдап, осы кодты енгізеді. Кіргендерге 40 балл автоматты түседі.' })]),
      h('div', { class: 'card' }, [h('h2', { text: 'Сабақ барысы' }), h('div', { class: 'stats4' }, [['Бар', present], ['Жоқ', all.length - present], ['Жұмысты бітірді', done]].map(([l, v]) => h('div', { class: 'stat4' }, [h('b', { text: String(v) }), h('span', { text: l })]))), h('div', { style: 'margin-top:14px' }, ctl)])]));
  }
  root.append(h('div', { class: 'row', style: 'margin:6px 0' }, [h('select', { class: 'field', style: 'max-width:240px', 'aria-label': 'Топ', on: { change: e => { gFilter = e.target.value; renderLive(); } } }, [h('option', { value: '', text: 'Барлық топ' })].concat(LIVE.groups.map(g => h('option', { value: String(g.id), text: g.name, selected: gFilter === String(g.id) ? 'selected' : false })))), ses ? h('span', { class: 'sub', text: ses.topic + '-тақырып · ' + hhmm(ses.created_at) + ' басталған' }) : '']));
  groups.forEach(g => {
    const rows = g.students.filter(s => s.active !== false).map(s => {
      const cls = !s.present ? 'absent' : s.ai_pct >= 70 ? 'red' : s.ai_pct >= 45 ? 'org' : '';
      const tc = n => { const t = s.tasks && s.tasks[n]; return h('td', { text: !t || !t.sent ? '—' : t.pending ? t.pts + '…' : t.pts + '/' + t.max }); };
      return h('tr', { class: cls }, [
        h('td', { class: 'l' }, [h('b', { text: s.name }), s.present ? h('span', { class: 'sub', text: hhmm(s.joined_at) + (s.manual ? ' · қолмен' : '') }) : '']),
        h('td', { text: s.present ? '✓ 40' : 'жоқ' }), h('td', { text: s.present ? '№' + s.variant : '' }), tc(1), tc(2), tc(3),
        h('td', {}, s.present && s.ai_pct ? h('span', { class: 'pill', style: 'background:' + (s.ai_pct >= 70 ? '#fecaca' : s.ai_pct >= 45 ? '#fed7aa' : '#bbf7d0'), text: s.ai_pct + '%' }) : '—'),
        h('td', {}, s.present ? [h('span', { class: 'pill', style: 'background:' + band(s.total), text: String(s.total) }), s.edited ? h('span', { class: 'sub mark', text: '✎' }) : ''] : '—'),
        h('td', {}, s.present ? [h('button', { class: 'btn sm', text: 'Ашу', on: { click: () => openDetail(ses.id, s.id) } }), ' ', s.device ? h('button', { class: 'btn sm', title: 'Басқа құрылғыдан кіруге рұқсат', text: '📱', on: { click: async () => { await api('release', { session_id: ses.id, student_id: s.id }); loadLive(); } } }) : '']
          : (ses ? h('button', { class: 'btn sm', text: '✓ Келді', on: { click: async () => { await api('attendance', { session_id: ses.id, student_id: s.id, present: true }); loadLive(); } } }) : ''))
      ]);
    });
    root.append(h('div', { class: 'gh' }, [h('h3', { text: g.name }), h('span', { class: 'sub', text: g.students.filter(s => s.present).length + ' / ' + g.students.length + ' бар' })]),
      g.students.length ? h('div', { class: 'tw' }, h('table', { class: 't' }, [h('thead', {}, h('tr', {}, ['Студент', 'Қатысым', 'Нұсқа', '1', '2', '3', 'ЖИ', 'Балл', ''].map((c, i) => h('th', { class: i === 0 ? 'l' : '', text: c })))), h('tbody', {}, rows)])) : h('p', { class: 'sub', text: 'Бұл топта студент жоқ.' }));
  });
  window.scrollTo(0, keep); if (ses && ses.work_until) tickTimer();
}

/* ---------- Студенттің толық жұмысы ---------- */
async function openDetail(sid, stu){ DETAIL = { sid, stu }; const j = await api('work?session=' + sid + '&student=' + stu); if (!j.ok) return; paintDetail(j); $('#ov').hidden = false; document.body.style.overflow = 'hidden'; }
function closeDetail(){ DETAIL = null; $('#ov').hidden = true; document.body.style.overflow = ''; }
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov') closeDetail(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && DETAIL) closeDetail(); });
async function reDetail(note){ const j = await api('work?session=' + DETAIL.sid + '&student=' + DETAIL.stu); if (j.ok) { paintDetail(j); if (note) { const m = $('#panel .msg'); if (m) { m.className = 'msg ok'; m.textContent = note; } } } loadLive(); }
const pre = (t, v) => h('div', { class: 'box' }, [h('h3', { text: t }), h('pre', { text: v === '' || v === undefined || v === null ? '—' : String(v) })]);
function paintDetail(j){
  const P = $('#panel'); P.innerHTML = ''; const c = j.calc;
  P.append(h('div', { class: 'p-head' }, [h('h2', { text: j.student.name }), h('span', { class: 'sub', text: j.student.group + ' · ' + j.session.topic + '-тақырып' + (j.attendance ? ' · нұсқа №' + j.attendance.variant : '') }), h('span', { class: 'sp' }), h('button', { class: 'btn', text: '✕ Жабу', on: { click: closeDetail } })]));
  const left = h('div', {}, [pre('Студентке берілген жүйе', j.sys), pre('Дұрыс жауап (тек сізге)', j.note)]);
  const right = h('div', {});
  const by = {}; j.subs.forEach(s => { by[s.task] = s; });
  [1, 2, 3].forEach(n => {
    const s = by[n], t = c.tasks[n];
    const title = n === 1 ? '1-тапсырма · Тест' : n === 2 ? '2-тапсырма · Қолмен есептеу' : '3-тапсырма · Бағдарлама';
    if (!s) { left.append(h('div', { class: 'box' }, [h('h3', { text: title }), h('p', { class: 'sub', text: 'Әлі жіберілмеген.' })])); return; }
    const p = s.payload, parts = [h('h3', { text: title + ' — ' + t.pts + ' / ' + t.max + (t.edited ? ' (сіз қойдыңыз)' : '') })];
    if (n === 1) parts.push(h('pre', { text: 'Таңдаған жауаптар (нөмірі): ' + (p.quiz || []).map(v => v === null ? '—' : v + 1).join(', ') + '\nДұрыс жауап балы: ' + s.auto_score + ' / 12' }));
    if (n === 2) parts.push(h('pre', { text: 'Жауаптар: ' + (p.ans || []).join(' ; ') + '\nЖауап балы: ' + s.auto_score + ' / 9' }), h('pre', { text: p.steps || '—' }));
    if (n === 3) parts.push(h('pre', { text: p.code || '—' }), h('pre', { text: 'Нәтиже: ' + (p.out || '—') + '\nНәтиже балы: ' + s.auto_score + ' / 6' }));
    if (n > 1) { parts.push(h('p', { class: 'sub', text: 'ЖИ: ' + (has(s.ai_score) ? s.ai_score + ' / ' + (n === 2 ? 15 : 18) + ' · ЖИ үлесі ' + s.ai_pct + '%' : 'әлі бағаланған жоқ') })); if (s.flags) parts.push(h('p', { class: 'aibox', text: s.flags })); if (s.ai_comment) parts.push(h('p', { class: 'aibox', text: s.ai_comment })); }
    const sc = h('input', { class: 'field', type: 'number', min: '0', max: String(t.max), style: 'width:90px', placeholder: String(t.pts), value: has(s.teacher_score) ? String(s.teacher_score) : '' });
    const cm = h('input', { class: 'field', type: 'text', placeholder: 'Пікір (міндетті емес)', value: s.teacher_comment || '', style: 'flex:1;min-width:160px' });
    parts.push(h('div', { class: 'row', style: 'margin-top:8px' }, [h('span', { text: 'Балл:' }), sc, cm, h('button', { class: 'btn sm primary', text: 'Сақтау', on: { click: async () => { await api('task_grade', { id: s.id, task: n, score: sc.value.trim(), comment: cm.value }); reDetail('Сақталды ✓'); } } }),
      n > 1 ? h('button', { class: 'btn sm', text: 'ЖИ-мен қайта', on: { click: async e => { e.target.disabled = true; e.target.textContent = 'Тексеріп жатыр…'; await api('regrade', { id: s.id }); reDetail('ЖИ қайта бағалады ✓'); } } }) : '',
      h('button', { class: 'btn sm danger', text: 'Қайта ашу', title: 'Студент бұл тапсырманы қайта жібере алады', on: { click: async () => { if (confirm('Тапсырманы өшіріп, студентке қайта жіберуге рұқсат бересіз бе?')) { await api('reopen', { id: s.id }); reDetail('Қайта ашылды ✓'); } } } })]));
    left.append(h('div', { class: 'box' }, parts));
  });
  const tot = h('input', { class: 'field big', type: 'number', min: '0', max: '100', placeholder: String(c.auto), value: j.result && has(j.result.teacher_total) ? String(j.result.teacher_total) : '' });
  const tc = h('textarea', { class: 'field', rows: '2', placeholder: 'Пікір (міндетті емес)' }); tc.value = j.result ? j.result.teacher_comment || '' : '';
  right.append(h('div', { class: 'box edit' }, [h('h3', { text: 'Қорытынды балл: ' + c.final + ' / 100' + (c.edited_total ? ' (сіз қойдыңыз)' : '') }),
    h('dl', { class: 'kv' }, [['Қатысым', c.attendance + ' / 40'], ['Тапсырмалар (сапа)', c.quality + ' / 60'], ['ЖИ үлесі', c.ai_pct + '%'], ['ЖИ коэффициенті', String(c.k)], ['Автоматты балл', String(c.auto)]].flatMap(([a, b]) => [h('dt', { text: a }), h('dd', { text: b })])),
    h('label', { text: 'Қорытынды балл (0–100). Бос қалса, автоматты балл алынады.' }), tot, h('label', { text: 'Пікір' }), tc,
    h('div', { class: 'row', style: 'margin-top:12px' }, [h('button', { class: 'btn primary', text: 'Сақтау', on: { click: async () => { const v = tot.value.trim(); if (v !== '' && (isNaN(+v) || +v < 0 || +v > 100)) return; await api('total', { session_id: DETAIL.sid, student_id: DETAIL.stu, total: v, comment: tc.value }); reDetail('Сақталды ✓ Журналға түсті.'); } } }),
      h('button', { class: 'btn', text: 'Автоматты баллға қайту', on: { click: async () => { await api('total', { session_id: DETAIL.sid, student_id: DETAIL.stu, total: null, comment: tc.value }); reDetail('Автоматты баллға қайтты ✓'); } } })]), h('div', { class: 'msg', role: 'status' })]));
  P.append(h('div', { class: 'p-body' }, [left, right]));
}

/* ---------- Топтар мен студенттер ---------- */
async function loadRoster(){ const j = await api('roster'); if (j.ok) { ROSTER = j.groups; renderRoster(); } }
function setRoster(j){ if (j.ok) { ROSTER = j.groups; renderRoster(); loadLive(); } }
function renderRoster(){
  const root = $('#s-roster'); root.innerHTML = '';
  const gn = h('input', { class: 'field', placeholder: 'Топ атауы, мысалы ИС-21', style: 'max-width:280px' });
  root.append(h('div', { class: 'card' }, [h('h2', { text: 'Жаңа топ' }), h('div', { class: 'row' }, [gn, h('button', { class: 'btn primary', text: '+ Топ қосу', on: { click: async () => { if (gn.value.trim()) setRoster(await api('groups', { name: gn.value })); } } })])]));
  ROSTER.forEach(g => {
    const names = h('textarea', { class: 'field', rows: '4', placeholder: 'Студенттердің аты-жөнін әр жолға бір-бірден қойыңыз (нөмірлері болса, автоматты алынады)' });
    root.append(h('div', { class: 'card' }, [
      h('div', { class: 'row' }, [h('h2', { text: g.name, style: 'margin:0' }), h('span', { class: 'sub', text: g.students.filter(s => s.active).length + ' студент' }), h('span', { class: 'sp' }),
        h('button', { class: 'btn sm', text: '✎ Атын өзгерту', on: { click: async () => { const n = prompt('Топтың жаңа атауы', g.name); if (n) setRoster(await api('groups/' + g.id, { name: n }, 'PATCH')); } } }),
        h('button', { class: 'btn sm danger', text: 'Топты жою', on: { click: async () => { if (confirm(g.name + ' тобын және оның студенттерінің барлық деректерін жоясыз ба?')) setRoster(await api('groups/' + g.id, null, 'DELETE')); } } })]),
      g.students.length ? h('div', { class: 'tw', style: 'margin:12px 0' }, h('table', { class: 't' }, [h('tbody', {}, g.students.map((s, i) => h('tr', { class: s.active ? '' : 'absent' }, [
        h('td', { text: String(i + 1), style: 'width:40px' }), h('td', { class: 'l', text: s.name + (s.active ? '' : ' (жасырылған)') }),
        h('td', { style: 'text-align:right' }, [h('button', { class: 'btn sm', text: '✎', title: 'Атын өзгерту', on: { click: async () => { const n = prompt('Аты-жөні', s.name); if (n) setRoster(await api('students/' + s.id, { name: n }, 'PATCH')); } } }), ' ',
          h('button', { class: 'btn sm', text: s.active ? 'Жасыру' : 'Қайтару', on: { click: async () => setRoster(await api('students/' + s.id, { active: !s.active }, 'PATCH')) } }), ' ',
          h('button', { class: 'btn sm danger', text: '🗑', title: 'Өшіру', on: { click: async () => { if (confirm(s.name + ' өшірілсін бе? Оның жұмыстары да өшеді.')) setRoster(await api('students/' + s.id, null, 'DELETE')); } } })])])))])) : h('p', { class: 'sub', text: 'Студент жоқ. Төменге тізімді қойыңыз.' }),
      names, h('div', { class: 'row', style: 'margin-top:8px' }, [h('button', { class: 'btn primary', text: '+ Студенттерді қосу', on: { click: async () => { if (names.value.trim()) setRoster(await api('students', { group_id: g.id, names: names.value })); } } })])]));
  });
}

/* ---------- Журнал ---------- */
async function loadJournal(){ const j = await api('journal'); if (j.ok) { JOUR = j; renderJournal(); } }
function jRows(){ return JOUR.groups.filter(g => !jf || String(g.id) === jf).flatMap(g => g.students.map(s => ({ g: g.name, s }))); }
function jTable(){ return [['Аты-жөні', 'Тобы'].concat(JOUR.topics.map(t => JOUR.titles[t]))].concat(jRows().map(r => [r.s.name, r.g].concat(JOUR.topics.map(t => (r.s.scores[t].attendance || r.s.scores[t].sent) ? r.s.scores[t].total : '')))); }
function renderJournal(){
  const root = $('#s-journal'); root.innerHTML = '';
  if (!JOUR.topics.length) { root.append(h('div', { class: 'card' }, h('p', { text: 'Әлі сабақ өткен жоқ.' }))); return; }
  const rows = jRows();
  root.append(h('div', { class: 'row', style: 'margin-bottom:12px' }, [h('select', { class: 'field', style: 'max-width:240px', on: { change: e => { jf = e.target.value; renderJournal(); } } }, [h('option', { value: '', text: 'Барлық топ' })].concat(JOUR.groups.map(g => h('option', { value: String(g.id), text: g.name, selected: jf === String(g.id) ? 'selected' : false })))), h('span', { class: 'sp' }),
    h('button', { class: 'btn', text: '📋 Көшіру', on: { click: async e => { try { await navigator.clipboard.writeText(jTable().map(r => r.join('\t')).join('\n')); e.target.textContent = '✓ Көшірілді'; } catch (x) { e.target.textContent = 'Көшіру мүмкін болмады'; } } } }),
    h('button', { class: 'btn', text: '⬇ CSV', on: { click: () => { const csv = '﻿' + jTable().map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\r\n'); const a = h('a', { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), download: 'журнал.csv' }); document.body.append(a); a.click(); a.remove(); } } })]));
  const cell = sc => {
    if (!sc.attendance && !sc.sent) return h('td', { style: 'background:#f3f4f6' }, h('span', { class: 'sub', text: 'жоқ' }));
    const sub = 'қатысым ' + sc.attendance + (sc.complete ? '' : ' · ' + sc.sent + '/3 тапсырма');
    return h('td', { style: 'background:' + band(sc.total) }, [h('b', { text: String(sc.total) }), sc.edited ? h('span', { class: 'sub mark', text: '✎' }) : '', h('span', { class: 'sub', text: sub })]);
  };
  const head = ['№', 'Студент', 'Топ'].concat(JOUR.topics.map(t => JOUR.titles[t])).map((c, i) => h('th', { class: i === 1 ? 'l' : '', text: c }));
  const body = rows.map((r, i) => h('tr', {}, [h('td', { text: String(i + 1) }), h('td', { class: 'l', text: r.s.name }), h('td', { text: r.g })].concat(JOUR.topics.map(t => cell(r.s.scores[t])))));
  root.append(h('div', { class: 'tw' }, h('table', { class: 't' }, [h('thead', {}, h('tr', {}, head)), h('tbody', {}, body)])));
}

if (TOK) start();
})();
</script>
